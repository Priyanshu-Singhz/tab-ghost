<!doctype html><meta charset="utf-8">
<style>
  body{width:260px;margin:0;padding:16px;font:14px -apple-system,system-ui,sans-serif;background:#f4f1ff;color:#2b2540}
  h1{font-size:16px;margin:0 0 6px} p{margin:0 0 12px;line-height:1.4;opacity:.8}
  #count{font-weight:600;margin:0 0 10px;opacity:1}
  button{width:100%;padding:8px;border:0;border-radius:8px;background:#2b2540;color:#fff;font-size:13px;cursor:pointer;transition:background .2s}

  button.done{background:#2e9e5b}
  #about{margin-top:16px;padding-top:12px;border-top:1px solid #d9d2f5}
  #about h2{font-size:13px;margin:0 0 6px} #about p{margin:0 0 6px;font-size:13px}
  #about a{color:#5a43d6;font-weight:600;text-decoration:none} #about a:hover{text-decoration:underline}
  #about small{opacity:.65;font-size:11px;line-height:1.3;display:block}
</style>
<h1>👻 Tab Ghost</h1>
<p>Closed tabs haunt the right edge of any page for 24 hours. Hover to peek, click to resurrect.</p>
<p id="count"></p>
<button id="b">Banish all ghosts</button>
